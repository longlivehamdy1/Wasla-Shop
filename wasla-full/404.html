<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة مش موجودة | Wasla</title><meta name="theme-color" content="#060913">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-family:'Segoe UI',Tahoma,sans-serif;color:#fff;overflow:hidden;
background:radial-gradient(800px circle at 85% 0%,rgba(255,60,60,.2),transparent 60%),radial-gradient(700px circle at 0% 100%,rgba(26,140,255,.16),transparent 60%),#060913}
.dots i{position:fixed;width:6px;height:6px;border-radius:50%;background:rgba(170,185,255,.6);animation:f 9s ease-in-out infinite}
.dots i:nth-child(1){top:12%;left:14%}.dots i:nth-child(2){top:70%;left:22%;animation-delay:-3s}.dots i:nth-child(3){top:28%;left:82%;animation-delay:-5s;background:#ff7a7a}.dots i:nth-child(4){top:80%;left:76%;animation-delay:-7s}.dots i:nth-child(5){top:50%;left:50%;animation-delay:-2s}
@keyframes f{50%{transform:translate(40px,-34px)}}
main{position:relative;z-index:1;max-width:460px}
h1{font-size:clamp(90px,22vw,170px);font-weight:900;line-height:1;background:linear-gradient(90deg,#ff5b5b,#ff9d6b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:p 3s ease-in-out infinite}
@keyframes p{50%{filter:drop-shadow(0 0 30px rgba(255,91,91,.55))}}
h2{font-size:24px;margin:8px 0 10px}p{color:#8b96ba;line-height:1.9;margin-bottom:26px}
a{display:inline-block;padding:15px 34px;border-radius:15px;color:#fff;text-decoration:none;font-weight:800;background:linear-gradient(90deg,#ff5b5b,#b31011);box-shadow:0 14px 34px rgba(255,60,60,.35);transition:.2s}
a:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(255,60,60,.5)}
</style></head><body>
<div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
<main><h1>404</h1><h2>الصفحة دي مش موجودة</h2><p>يمكن الرابط اتغيّر أو فيه غلطة فيه. ارجع للرئيسية وكمّل شغلك.</p><a href="/">↩ الرجوع للرئيسية</a></main>
</body></html>
